name: DAST

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: test-auth-secret-for-dast-only
      AUTH_GOOGLE_ID: replace-me
      AUTH_GOOGLE_SECRET: replace-me
      NEXTAUTH_URL: http://127.0.0.1:3000
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_replace_me
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_replace_me
      APP_URL: http://127.0.0.1:3000
      RESEND_FROM_EMAIL: shop@example.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed test data
        run: npm run db:seed

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start > /tmp/ecom-app.log 2>&1 &
          echo $! > /tmp/ecom-app.pid

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/ecom-app.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          fail_action: true
          allow_issue_writing: false

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-app-log
          path: /tmp/ecom-app.log
